x-app-environment: &app-environment
  DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/finance_db
  DATABASE_URL_SYNC: postgresql+psycopg2://postgres:postgres@db:5432/finance_db
  PARSER_SERVICE_URL: http://parser:8001
  PARSER_SERVICE_TIMEOUT_SECONDS: "30"
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/1

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: finance_db
    # Host port omitted: local PostgreSQL often uses 5432.
    # For DBeaver/psql from host, uncomment: "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d finance_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    # Internal only; api/celery connect via redis:6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  parser:
    build:
      context: ./parser
    ports:
      - "8001:8001"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
    ports:
      - "8000:8000"
    environment:
      <<: *app-environment
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      parser:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
      uvicorn app:app --host 0.0.0.0 --port 8000"

  celery_worker:
    build:
      context: .
    environment:
      <<: *app-environment
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      parser:
        condition: service_healthy
    command: celery -A app.celery_app worker --loglevel=info

volumes:
  postgres_data:
